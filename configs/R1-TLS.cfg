! =============================================================
! R1-TLS: Toulouse site router (headquarters)
! Roles: inter-VLAN routing (router-on-a-stick), DHCP, ACL, NAT,
!        IPsec-encrypted GRE tunnel (IKEv2) to Paris, OSPF
! Target image: Cisco IOSv (GNS3 / EVE-NG)
! =============================================================
hostname R1-TLS
no ip domain-lookup
ip domain-name lab.local
service password-encryption
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
!
! ---------- SSH-only management access ----------
crypto key generate rsa modulus 2048
ip ssh version 2
ip access-list standard MGMT-ONLY
 remark Management allowed from VLAN 99 only
 permit 192.168.99.0 0.0.0.255
 deny   any log
line vty 0 4
 login local
 transport input ssh
 access-class MGMT-ONLY in
 exec-timeout 10 0
!
! ---------- Router ID ----------
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
! ---------- LAN: router-on-a-stick to SW1-TLS ----------
interface GigabitEthernet0/0
 description TRUNK to SW1-TLS
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description VLAN 10 - Users
 encapsulation dot1Q 10
 ip address 192.168.10.1 255.255.255.0
 ip access-group USERS-IN in
 ip nat inside
!
interface GigabitEthernet0/0.20
 description VLAN 20 - Servers
 encapsulation dot1Q 20
 ip address 192.168.20.1 255.255.255.0
 ip nat inside
!
interface GigabitEthernet0/0.99
 description VLAN 99 - Management
 encapsulation dot1Q 99
 ip address 192.168.99.1 255.255.255.0
 ip nat inside
!
! ---------- WAN to the ISP ----------
interface GigabitEthernet0/1
 description WAN to R3-ISP
 ip address 10.0.13.1 255.255.255.252
 ip nat outside
 no shutdown
!
ip route 0.0.0.0 0.0.0.0 10.0.13.2
!
! ---------- DHCP for users ----------
ip dhcp excluded-address 192.168.10.1 192.168.10.20
ip dhcp pool VLAN10-USERS
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 192.168.20.10
 domain-name lab.local
!
! ---------- Users VLAN filtering ----------
ip access-list extended USERS-IN
 remark Allow DHCP
 permit udp any eq bootpc any eq bootps
 remark Servers: web, DNS and ping only
 permit tcp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 eq www
 permit tcp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 eq 443
 permit udp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 eq domain
 permit icmp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 echo
 deny   ip 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 log
 remark No access to the management VLAN
 deny   ip 192.168.10.0 0.0.0.255 192.168.99.0 0.0.0.255 log
 remark Everything else (Internet, Paris site) is allowed
 permit ip 192.168.10.0 0.0.0.255 any
!
! ---------- NAT (PAT) for Internet access ----------
ip access-list standard NAT-LAN
 permit 192.168.10.0 0.0.0.255
 permit 192.168.20.0 0.0.0.255
 permit 192.168.99.0 0.0.0.255
ip nat inside source list NAT-LAN interface GigabitEthernet0/1 overload
!
! ---------- Site-to-site VPN: IKEv2 + IPsec protecting a GRE tunnel ----------
crypto ikev2 proposal PROP-AES256
 encryption aes-cbc-256
 integrity sha256
 group 14
crypto ikev2 policy POL-SITES
 proposal PROP-AES256
crypto ikev2 keyring KR-SITES
 peer R2-PAR
  address 10.0.23.1
  pre-shared-key CHANGE_ME_PSK
crypto ikev2 profile IKEV2-SITES
 match identity remote address 10.0.23.1 255.255.255.255
 authentication remote pre-share
 authentication local pre-share
 keyring local KR-SITES
!
crypto ipsec transform-set TS-AES256 esp-aes 256 esp-sha256-hmac
 mode transport
crypto ipsec profile IPSEC-SITES
 set transform-set TS-AES256
 set ikev2-profile IKEV2-SITES
!
interface Tunnel0
 description GRE/IPsec to R2-PAR
 ip address 172.16.12.1 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source GigabitEthernet0/1
 tunnel destination 10.0.23.1
 tunnel protection ipsec profile IPSEC-SITES
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 CHANGE_ME_OSPF
!
! ---------- OSPF between sites, inside the tunnel only ----------
router ospf 1
 router-id 1.1.1.1
 passive-interface default
 no passive-interface Tunnel0
 network 172.16.12.0 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.99.0 0.0.0.255 area 0
 network 1.1.1.1 0.0.0.0 area 0
!
end
