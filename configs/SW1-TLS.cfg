! =============================================================
! SW1-TLS: Toulouse site access switch
! Target image: Cisco IOSvL2 (GNS3 / EVE-NG)
! =============================================================
hostname SW1-TLS
no ip domain-lookup
ip domain-name lab.local
service password-encryption
enable secret CHANGE_ME_ENABLE
username admin privilege 15 secret CHANGE_ME_ADMIN
!
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan 99
 name MANAGEMENT
vlan 999
 name NATIVE-UNUSED
!
! ---------- Trunk to the router ----------
interface GigabitEthernet0/0
 description TRUNK to R1-TLS
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,99
 switchport nonegotiate
!
! ---------- Access ports ----------
interface GigabitEthernet0/1
 description User PC
 switchport mode access
 switchport access vlan 10
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/2
 description Web/DNS server 192.168.20.10
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
!
interface GigabitEthernet0/3
 description Admin workstation
 switchport mode access
 switchport access vlan 99
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! ---------- Unused ports: shut down and isolated ----------
interface range GigabitEthernet1/0 - 3
 description UNUSED
 switchport mode access
 switchport access vlan 999
 shutdown
!
! ---------- Switch management ----------
interface Vlan99
 ip address 192.168.99.2 255.255.255.0
 no shutdown
ip default-gateway 192.168.99.1
!
crypto key generate rsa modulus 2048
ip ssh version 2
line vty 0 4
 login local
 transport input ssh
!
end
