! =============================================================
! R3-ISP: simulates the ISP / Internet
! It does NOT know the sites' private networks: inter-site
! traffic can only flow through the encrypted tunnel.
! =============================================================
hostname R3-ISP
no ip domain-lookup
!
interface Loopback0
 description Simulated "Internet" server
 ip address 8.8.8.8 255.255.255.255
!
interface GigabitEthernet0/0
 description To R1-TLS
 ip address 10.0.13.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 description To R2-PAR
 ip address 10.0.23.2 255.255.255.252
 no shutdown
!
end
